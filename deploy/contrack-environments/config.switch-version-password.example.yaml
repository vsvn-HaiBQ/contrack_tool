# Copy outside the source tree to Contrack-Recreate/config/environment.yaml.
enabled: true
operation_mode: switch_version
server: runtime/server
# Root is supplied by CT_ENV_ROOT in the Compose override.
switch_version:
  auth_method: password
  ssh_host: "10.166.136.7"
  ssh_port: 22
  ssh_user: "vsvndev"
  # Option A: one-line UTF-8 secret file in the mounted SSH directory (recommended).
  ssh_password_file: /run/contrack-switch/ssh_password
  # Option B: remove ssh_password_file above and uncomment; literal password wins over the file.
  # ssh_password: 'REPLACE_WITH_LINUX_PASSWORD'
  known_hosts: /run/contrack-switch/known_hosts
  runner_path: /home/vsvndev/contrack_tool/backend/app/modules/contrack_environments/host_runner.py
  host_config: /home/vsvndev/Contrack-Recreate/config/host-switch.json
  timeout: 7200
