# WAR copy only. Uses the original backend Dockerfile; Java/PG CLI and template mounts are unnecessary.
services:
  backend:
    environment:
      CONTRACK_ENV_CONFIG: /etc/contrack/environment.yaml
      CONTRACK_ENV_ROOT: ${CT_ENV_ROOT:?Set CT_ENV_ROOT to the existing contrack-env directory}
    volumes:
      - type: bind
        source: ${CT_ENV_ROOT:?Set CT_ENV_ROOT to the existing contrack-env directory}
        target: ${CT_ENV_ROOT:?Set CT_ENV_ROOT to the existing contrack-env directory}
        bind:
          create_host_path: false
      - type: bind
        source: ${CT_ENV_CONFIG:?Set CT_ENV_CONFIG to the deploy_war configuration file}
        target: /etc/contrack/environment.yaml
        read_only: true
        bind:
          create_host_path: false
